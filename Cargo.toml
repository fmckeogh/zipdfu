[package]
name = "zipdfu"
version = "0.1.0"
edition = "2024"
description = "Create legacy DFU .zip packages for Nordic nRF5 bootloaders, like `adafruit-nrfutil dfu genpkg`"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
crc = "3.4.0"
ihex = "3.0.0"
serde_json = "1.0.154"
zip = { version = "9.3.0", default-features = false }
